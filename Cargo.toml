[package]
name = "gmenu"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A centered, dmenu-like launcher for X11 with match highlighting"
repository = "https://github.com/pglira/gmenu"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
memchr = "2"
rayon = "1"
x11rb = { version = "0.13", features = ["randr", "image"] }
cairo-rs = "0.20"
pango = "0.20"
pangocairo = "0.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
